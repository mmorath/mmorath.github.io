site_name: Hecate
site_description: Hecate — universal, profile-driven geo-referencing of physical objects
site_url: https://mmorath.github.io/
site_author: Matthias Morath
copyright: © 2023-2026 Matthias Morath · All rights reserved

theme:
  name: material
  logo: assets/hecate-logo.png            # transparent white mark — blends on the black header
  favicon: assets/hecate-favicon.svg      # transparent adaptive SVG — white maze on dark tabs, dark on light
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    # navigation.sections is deliberately NOT set: it renders every top-level
    # group as an always-open section, which is what made the sidebar show
    # ~30 entries at once on a first visit. Without it, Material's default
    # applies — groups are collapsible and open only along the active path.
    - navigation.indexes   # a group's own index page IS the group's link
    - navigation.top
    # navigation.instant intentionally omitted: it breaks the i18n language
    # switcher's contextual (same-page) link (mkdocs-static-i18n warns on it).
    - content.action.edit
    # toc.integrate is deliberately NOT set (and is incompatible with
    # navigation.indexes): it folded every page's headings into the left
    # sidebar, so the landing page alone contributed seven more lines to the
    # very list we are trying to shorten. The table of contents now lives on
    # the right, where it belongs to the page rather than to the site.

extra_css:
  - assets/extra.css

# English is the default (served at /); German builds at /de/ and French at
# /fr/. Pages are the un-suffixed English files; each `*.de.md` / `*.fr.md` is a
# translation, and the Material header gets a language switcher automatically.
# Adding a `plugins:` block disables the implicit `search`, so it is re-declared.
plugins:
  - search
  - glightbox
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Getting started: Erste Schritte
            The apps: Die Apps
            For operators: Für Anwender
            For admins: Für Administratoren
            Overview: Überblick
            The problem: Das Problem
            What it does: Was sie leistet
            Privacy: Datenschutz
            Support: Support
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Getting started: Premiers pas
            Vision & Mission: Vision & mission
            The apps: Les applications
            For operators: Pour les opérateurs
            For admins: Pour les administrateurs
            Overview: Présentation
            The problem: Le problème
            What it does: Ce qu'elle fait
            Privacy: Confidentialité
            Support: Assistance
        - locale: es
          name: Español
          build: true
          nav_translations:
            Getting started: Primeros pasos
            Vision & Mission: Visión y misión
            The apps: Las aplicaciones
            For operators: Para operadores
            For admins: Para administradores
            Overview: Resumen
            The problem: El problema
            What it does: Qué hace
            Privacy: Privacidad
            Support: Soporte

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      # Headings still get slug ids (so .../#in-one-minute links keep working);
      # we just don't append the visible ¶ permalink symbol next to each title.
      permalink: false
  # Render Material/Octicons :icon: shortcodes used by the grid cards as SVGs
  # rather than leaking the literal ":material-...:" text onto the page.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# One umbrella /hecate/ site bundling all three apps. The Dachseite
# (hecate/index.md) is the landing; each app is a nav group with its own
# Overview / Privacy / Support, plus standalone Support and Privacy hubs. The
# bare root (index.md) and the old /hecate-admin/ page are redirect stubs and so
# are intentionally not listed. Translations fall back to English (the i18n
# plugin serves the English page under /de/ and /fr/ when a *.de/*.fr is absent).
nav:
  - Hecate: hecate/index.md
  # Second stop after the landing page, deliberately ahead of the app group:
  # a visitor who has decided to try Hecate needs the broker set up before any
  # single app's overview is useful to them.
  - Getting started: hecate/getting-started/index.md
  # Right after Getting started: the page that says WHY the product is built
  # this way — the subscription model and the privacy stance both point here.
  - Vision & Mission: hecate/vision/index.md
  # One collapsed group instead of five always-open ones. The three viewers
  # are one product on three screens, so they read as one entry with three
  # children rather than three separate top-level groups.
  - The apps:
      - Hecate Capture:
          - Overview: hecate/capture/index.md
          - The problem: hecate/capture/problem.md
          - What it does: hecate/capture/solution.md
      - Hecate Admin:
          - Overview: hecate/admin/index.md
      - Hecate Viewer:
          - iPhone: hecate/viewer-ios/index.md
          - iPad: hecate/viewer-ipad/index.md
          - Apple TV: hecate/viewer-tvos/index.md
  # Support and Privacy used to appear TWICE for every app (five groups × two
  # links) plus once as hubs — ten of the ~30 sidebar entries were the same
  # two pages over and over. They now live once, as collapsed groups whose
  # first child is the hub itself (navigation.indexes). The per-app pages keep
  # their URLs: App Store Connect links straight at them, and nav placement
  # never moves a page.
  - Support:
      - hecate/support/index.md
      - For operators: hecate/support/operator/index.md
      - For admins: hecate/support/admin/index.md
  - Privacy:
      - hecate/privacy/index.md
      - Hecate Capture: hecate/privacy/capture/index.md
      - Hecate Admin: hecate/privacy/admin/index.md
      - Hecate Viewer (iPhone): hecate/privacy/viewer-ios/index.md
      - Hecate Viewer (iPad): hecate/privacy/viewer-ipad/index.md
      - Hecate Viewer (Apple TV): hecate/privacy/viewer-tvos/index.md
